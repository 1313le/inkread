<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 印泥质感：只留极轻的纸纹噪点，其余全删（Deliver 减法） -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .035 0"/>
    </filter>
  </defs>

  <!-- 宣纸底 -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#efe9db"/>
  <rect x="8" y="8" width="496" height="496" rx="112" filter="url(#grain)"/>

  <!-- 朱砂方章：直角近方，钤印的果敢 -->
  <rect x="128" y="128" width="256" height="256" rx="10" fill="#9e3b2b"/>

  <!-- 白文「墨」：KaiTi 白文，章法居中 -->
  <text x="256" y="330" text-anchor="middle" font-family="KaiTi, STKaiti, 'Noto Serif SC', serif"
        font-size="168" fill="#f6f1e3">墨</text>

  <!-- 错位小方块：开场动画的记忆点，与方章之间留一条负空间缝（错位构成） -->
  <rect x="396" y="88" width="44" height="44" fill="#9e3b2b"/>
</svg>
